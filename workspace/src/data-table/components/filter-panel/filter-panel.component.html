<div class="filter-panel card shadow-lg border-0 ag-filter-panel" *ngIf="isVisible" [style.top.px]="position.top"
  [style.left.px]="position.left" style="position: fixed; z-index: 1050; width: 320px; max-height: 600px;"
  (click)="$event.stopPropagation()">
  <div class="card-header bg-theme-header py-2">
    <div class="d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Filters</h5>
      <div class="btn-group" role="group">
        <button type="button" class="btn btn-sm border" [class.btn-primary]="sortDirection === 'asc'"
          [class.btn-light]="sortDirection !== 'asc'" (click)="onSortChange('asc')">
          ↑ Asc
        </button>
        <button type="button" class="btn btn-sm border" [class.btn-primary]="sortDirection === 'desc'"
          [class.btn-light]="sortDirection !== 'desc'" (click)="onSortChange('desc')">
          ↓ Desc
        </button>
      </div>
    </div>
  </div>

  <div class="card-body p-3">
    <!-- Sort Section -->
    <!-- Filter Section -->
    <div class="mb-1">
      <!-- <h6 class="fw-semibold mb-2 small">Filter</h6> -->

      <!-- Filter Mode Toggle -->
      <div class="btn-group w-100 mb-3" role="group" *ngIf="isTextColumn || isNumberColumn || isDateColumn">
        <button type="button" class="btn btn-sm border" [class.btn-primary]="filterMode === 'list'"
          [class.btn-light]="filterMode !== 'list'" (click)="switchToListMode()">
          ☰ Choose One
        </button>
        <button type="button" class="btn btn-sm border" [class.btn-primary]="filterMode === 'text'"
          [class.btn-light]="filterMode !== 'text'" (click)="switchToTextMode()">
          <span *ngIf="isTextColumn">📝 Text</span>
          <span *ngIf="isNumberColumn">🔢 Number</span>
          <span *ngIf="isDateColumn">📅 Date</span>
        </button>
      </div>

      <!-- Text Filter Mode -->
      <div *ngIf="filterMode === 'text' && isTextColumn">
        <select class="form-select form-select-sm mb-2" [(ngModel)]="textFilterOperator"
          (ngModelChange)="onTextFilterChange()">
          <option *ngFor="let op of textFilterOperators" [value]="op.value">{{ op.label }}</option>
        </select>
        <input type="text" class="form-control form-control-sm" placeholder="Enter text..."
          [(ngModel)]="textFilterValue" (ngModelChange)="onTextFilterChange()">
      </div>

      <!-- Number Filter Mode -->
      <div *ngIf="filterMode === 'text' && isNumberColumn">
        <select class="form-select form-select-sm mb-3" [(ngModel)]="numberFilterOperator"
          (ngModelChange)="onNumberFilterChange()">
          <option *ngFor="let op of numberFilterOperators" [value]="op.value">{{ op.label }}</option>
        </select>
        <div class="d-flex flex-column gap-2">
          <input *ngIf="!['top10', 'bottom10', 'aboveAverage', 'belowAverage'].includes(numberFilterOperator)"
            type="number" class="form-control form-control-sm" placeholder="Enter number..."
            [(ngModel)]="numberFilterValue" (ngModelChange)="onNumberFilterChange()">
          <input *ngIf="numberFilterOperator === 'between'" type="number" class="form-control form-control-sm"
            placeholder="And..." [(ngModel)]="numberFilterValue2" (ngModelChange)="onNumberFilterChange()">
        </div>
      </div>

      <!-- Date Filter Mode -->
      <div *ngIf="filterMode === 'text' && isDateColumn">
        <select class="form-select form-select-sm mb-2" [(ngModel)]="dateFilterOperator"
          (ngModelChange)="onDateFilterChange()">
          <option *ngFor="let op of dateFilterOperators" [value]="op.value">{{ op.label }}</option>
        </select>
        <div class="d-flex flex-column gap-2">
          <input *ngIf="['equals', 'before', 'after', 'between'].includes(dateFilterOperator)" type="date"
            class="form-control form-control-sm" [(ngModel)]="dateFilterValue" (ngModelChange)="onDateFilterChange()">
          <input *ngIf="dateFilterOperator === 'between'" type="date" class="form-control form-control-sm"
            [(ngModel)]="dateFilterValue2" (ngModelChange)="onDateFilterChange()">
        </div>
      </div>

      <!-- List Filter Mode -->
      <div *ngIf="filterMode === 'list'">
        <!-- Search -->
        <div class="search-container mb-3">
          <i class="bi bi-search search-icon"></i>
          <input type="text" class="form-control form-control-sm search-input" placeholder="Search values..."
            aria-label="Search" [(ngModel)]="searchTerm">
        </div>

        <!-- Select All -->
        <div class="d-flex justify-content-between align-items-center">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="selectAll" [(ngModel)]="selectAll"
              (change)="onSelectAllChange()">
            <label class="form-check-label fw-medium" for="selectAll">
              All ({{ filteredOptions.length }})
            </label>
          </div>
          <button class="btn btn-light btn-sm border" (click)="clearFilter()">Clear</button>
        </div>
        <hr class="my-2">
        <!-- Filter Options -->
        <div style="max-height: 260px; overflow-y: auto;">
          <div class="text-center py-3" *ngIf="loading">
            <div class="spinner"></div>
            <div class="small text-muted mt-1">Loading options...</div>
          </div>

          <div class="form-check d-flex justify-content-between align-items-center py-1 pe-2"
            *ngFor="let option of filteredOptions">
            <div class="d-flex align-items-center">
              <input class="form-check-input me-2" type="checkbox" [id]="'option-' + option.key"
                [checked]="option.selected" (change)="onOptionChange(option)">
              <label class="form-check-label small" [for]="'option-' + option.key">
                {{ option.value }}
              </label>
            </div>
            <span class="badge bg-secondary small">{{ option.count }}</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Auto Apply -->
  <!-- <div class="px-3 py-2 border-top border-theme bg-theme-surface">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="autoApply" [(ngModel)]="autoApply">
      <label class="form-check-label small" for="autoApply">Auto Apply</label>
    </div>
  </div> -->

  <!-- Action Buttons -->
  <!-- <div class="card-footer bg-theme-header d-flex justify-content-between">
    <button class="btn btn-light btn-sm" (click)="clearFilter()">Clear</button>
    <div class="d-flex gap-2">
      <button class="btn btn-primary btn-sm" (click)="applyFilter()" *ngIf="!autoApply">Apply</button>
      <button class="btn btn-danger btn-sm" (click)="onClose()">×</button>
    </div>
  </div> -->
</div>
