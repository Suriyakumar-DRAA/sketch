<div class="ag-container">
    <!-- Active Filters -->
    <div class="data-table-active-filter mb-2" *ngIf="activeFilters.size > 0 || searchTerm">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="fw-medium small">Active Filters:</span>

                <!-- Search Filter -->
                <span class="badge bg-primary d-flex align-items-center gap-1" *ngIf="searchTerm">
                    Search: "{{ searchTerm }}"
                    <button type="button" class="btn-close btn-close-white" aria-label="Close"
                        (click)="searchTerm=''; onSearchChange()" style="font-size: 0.6em;"></button>
                </span>

                <!-- Column Filters -->
                <span class="badge bg-primary d-flex align-items-center gap-1"
                    *ngFor="let filter of activeFiltersArray">
                    {{ getFilterLabel(filter.column) }}
                    <button type="button" class="btn-close btn-close-white" aria-label="Close"
                        (click)="removeFilter(filter.column)" style="font-size: 0.6em;"></button>
                </span>
            </div>

            <button class="btn btn-light border btn-sm" (click)="clearAllFilters()">
                Clear All
            </button>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="mb-2">
        <div class="d-flex justify-content-end gap-2 align-items-center">
            <!-- Search Box (not in an input group) -->
            <div class="data-table-search-container col-4">
                <i class="bi bi-search data-table-search-icon"></i>
                <input type="text" class="form-control data-table-search-input" placeholder="Search all columns..."
                    aria-label="Search" [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()">
            </div>
            <!-- Export to Excel Button -->
            <div class="col-1" *ngIf="exportData.observers.length > 0">
                <button type="button" class="btn btn-light btn-sm border" (click)="exportData.emit()">
                    <i class="bi bi-file-earmark-arrow-down me-1"></i>
                    Export Excel
                </button>
            </div>
            <div>
                <button type="button" class="btn btn-secondary btn-sm border" (click)="onSettings()">
                    <i class="bi bi-gear"> Settings</i>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Data Table -->
<div class="table-responsive ag-datatables" style="max-height: 600px; overflow-y: auto;">
    <table class="table table-bordered table-hover mb-0">
        <thead class="sticky-top">
            <tr>
                <th *ngFor="let column of displayColumns">
                    <app-column-header [config]="column" [hasActiveFilter]="hasActiveFilter(column.key)"
                        [excelFiltersEnabled]="excelFiltersEnabled" [sortDirection]="getSortDirection(column.key)"
                        (filter)="onFilter($event)" (sort)="onSort($event)">
                    </app-column-header>
                </th>
            </tr>
        </thead>
        <tbody>
            <tr *ngIf="displayData.length === 0">
                <td [attr.colspan]="displayColumns.length" class="text-center">
                    No data available
                </td>
            </tr>
            <!-- Totals Row -->
            <tr class="table-totals" *ngIf="showTotals && displayData.length > 0">
                <td *ngFor="let column of displayColumns" class="fw-bold">
                    <span *ngIf="column.type === 'number' || column.type === 'currency'">
                        <div class="total-display">
                            <div class="filtered-total" *ngIf="hasActiveFiltersOrSearch()">
                                Filtered: {{ calculateColumnTotal(column.key) | number }}
                            </div>
                            <div class="grand-total" *ngIf="hasActiveFiltersOrSearch()">
                                Total: {{ calculateColumnGrandTotal(column.key) | number }}
                            </div>
                            <div class="single-total" *ngIf="!hasActiveFiltersOrSearch()">
                                Total: {{ calculateColumnTotal(column.key) | number }}
                            </div>
                        </div>
                    </span>
                </td>
            </tr>
            <tr *ngFor="let row of displayData" (click)="onRowClick(row)">
                <ng-container *ngFor="let column of displayColumns">
                    <td [style.width]="column.width" class="{{ column.columnClass || '' }}"
                        (click)="onColumnClick($event, row, column)" *ngIf="row[column.key + '_rowspan'] !== 0"
                        [attr.rowspan]="row[column.key + '_rowspan'] || null"
                        [ngClass]="{ 'merged-cell': row[column.key + '_rowspan'] > 0 }">
                        <ng-container *ngIf="column.template; else defaultCell">
                            <ng-container
                                *ngTemplateOutlet="column.template; context: { $implicit: row[column.key], row: row, column: column }">
                            </ng-container>
                        </ng-container>

                        <ng-template #defaultCell>
                            <ng-container [ngSwitch]="!!column.link">
                                <a *ngSwitchCase="true"
                                    [href]="column.link?.getUrlFn ? column.link?.getUrlFn(row[column.key], row) : column.link?.staticUrl"
                                    [attr.target]="column.link!.target || '_self'"
                                    [innerHTML]="getFormattedCell(row, column)">
                                </a>
                                <span *ngSwitchDefault class="{{ getHighlightClass(row[column.key], column) }}"
                                    [innerHTML]="getFormattedCell(row, column)">
                                </span>
                            </ng-container>
                        </ng-template>
                    </td>
                </ng-container>

            </tr>
        </tbody>
    </table>
</div>

<!-- Pagination -->
<app-pagination *ngIf="displayData.length > 0" [config]="paginationConfig" (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)" (goToPage)="onGoToPage($event)">
</app-pagination>

<!-- Filter Panel -->
<app-filter-panel *ngIf="filterPanelColumn" [column]="filterPanelColumn" [isVisible]="filterPanelVisible"
    [position]="filterPanelPosition" (apply)="onFilterApply($event)" (close)="onFilterClose()">
</app-filter-panel>

<app-settings [isSettingsVisible]="settingsVisible" (close)="onClose()" [columns]="columns"
    [visibleColumns]="visibleColumns" (columnsChange)="onColumnsChange($event)" (totalChange)="onTotalChange($event)"
    [showTotals]="showTotals">
</app-settings>
